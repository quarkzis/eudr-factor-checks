name: tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest -v

      - name: Upload sample cost summary
        uses: actions/upload-artifact@v4
        with:
          name: sample-cost-summary
          path: reports/sample-cost-summary.csv
